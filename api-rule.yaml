apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: seat-allocator-api
spec:
  gateway: kyma-system/kyma-gateway
  hosts:
    - seat-allocator
  service:
    name: seat-allocator-service
    port: 80
  rules:
    - path: /*
      methods:
        - GET
        - POST
        - PUT
        - DELETE
      noAuth: true